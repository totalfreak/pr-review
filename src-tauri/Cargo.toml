[package]
name = "stroll"
version = "0.6.2"
description = "Guided, step-by-step GitHub Pull Request review desktop app"
authors = ["Daniel"]
license = "MIT"
repository = "https://github.com/totalfreak/stroll"
homepage = "https://github.com/totalfreak/stroll"
edition = "2021"

[lib]
name = "stroll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-http = "2.8.0"
tauri-plugin-store = "2.5.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-c-sharp = "0.23"
